appId: br.com.codecrafters.geopop
---
- runFlow: "00_setup.yaml"
- tapOn:
    id: "tab-relatorios"
- extendedWaitUntil:
    visible:
      id: "events-screen"
    timeout: 15000
- assertVisible: "Eventos"

# Filtro por tipo de evento (bottom-sheet)
- assertVisible:
    id: "filter-tipo"
- tapOn:
    id: "filter-tipo"
- assertVisible: "Filtrar por tipo de evento"
- tapOn:
    id: "tipo-option-0"
- extendedWaitUntil:
    notVisible: "Filtrar por tipo de evento"
    timeout: 5000
- assertVisible: "Ignição Ligada"
- tapOn:
    id: "filter-tipo"
- extendedWaitUntil:
    visible: "Filtrar por tipo de evento"
    timeout: 10000
- tapOn:
    id: "tipo-option-2"
- extendedWaitUntil:
    notVisible: "Filtrar por tipo de evento"
    timeout: 5000
- assertVisible: "Velocidade Excedida"
- tapOn:
    id: "filter-tipo"
- extendedWaitUntil:
    visible: "Filtrar por tipo de evento"
    timeout: 10000
- tapOn:
    id: "tipo-option-all"
- extendedWaitUntil:
    notVisible: "Filtrar por tipo de evento"
    timeout: 5000

# Filtro por veículo (bottom-sheet)
- tapOn:
    id: "filter-veiculo"
- extendedWaitUntil:
    visible: "Filtrar por veículo"
    timeout: 10000
- tapOn:
    id: "veiculo-option-all"

# Período (controle segmentado)
- tapOn:
    id: "period-24h"
- tapOn:
    id: "period-7d"
- tapOn:
    id: "period-30d"
- tapOn:
    id: "period-tudo"

# Alterna para Percursos e volta
- tapOn: "Percursos"
- assertVisible:
    id: "routes-screen"
- tapOn: "Eventos"
- assertVisible:
    id: "events-screen"
