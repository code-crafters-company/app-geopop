appId: br.com.codecrafters.geopop
---
- runFlow: "00_setup.yaml"
- assertVisible:
    id: "map-screen"
- assertVisible:
    id: "vehicle-panel"
- assertVisible: "Meus veículos"
- assertVisible:
    id: "vehicle-search"

# Busca e filtros iguais ao portal
- tapOn:
    id: "vehicle-search"
- inputText: "TESTE"
- eraseText: 5
# Dispensa o teclado tocando na area do mapa (hideKeyboard instavel no iOS;
# nao tocar no titulo do painel, que o colapsa)
- tapOn:
    point: "50%,32%"
- tapOn:
    id: "vehicle-filter-on"
- tapOn:
    id: "vehicle-filter-off"
- tapOn:
    id: "vehicle-filter-all"

# Alterna o tipo de mapa: Padrao / Satelite / Hibrido
- tapOn:
    id: "map-type-toggle"
- assertVisible:
    id: "map-type-satellite"
- tapOn:
    id: "map-type-satellite"
- tapOn:
    id: "map-type-toggle"
- tapOn:
    id: "map-type-hybrid"
- tapOn:
    id: "map-type-toggle"
- tapOn:
    id: "map-type-standard"

# Abre notificacoes pelo sino do cabecalho e retorna pela aba Mapa
- tapOn:
    id: "notifications-button"
- assertVisible:
    id: "notifications-screen"
- tapOn:
    id: "tab-mapa"
- assertVisible:
    id: "map-screen"

# Botao "Ver todos" abre a lista completa de veiculos (doc secao 4)
- tapOn:
    id: "open-vehicle-list"
- extendedWaitUntil:
    visible:
      id: "vehicles-screen"
    timeout: 15000
- tapOn:
    id: "tab-mapa"
- assertVisible:
    id: "map-screen"
