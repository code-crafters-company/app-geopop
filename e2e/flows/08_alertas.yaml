appId: br.com.codecrafters.geopop
---
- runFlow: "00_setup.yaml"
- tapOn:
    id: "tab-alertas"
- assertVisible:
    id: "notifications-screen"
- assertVisible: "Alertas"

- runFlow:
    when:
      visible:
        id: "notification-unread-.*"
    commands:
      - tapOn:
          id: "notification-unread-.*"
          index: 0
- runFlow:
    when:
      visible:
        id: "mark-all-btn"
    commands:
      - tapOn:
          id: "mark-all-btn"
      - extendedWaitUntil:
          notVisible:
            id: "mark-all-btn"
          timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "notification-unread-.*"
    timeout: 15000
- swipe:
    direction: DOWN
- assertVisible:
    id: "notifications-screen"
