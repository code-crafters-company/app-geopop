appId: br.com.codecrafters.geopop
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 20000
- tapOn:
    id: "email-input"
- inputText: ${GEOPOP_EMAIL}
- tapOn:
    id: "senha-input"
- inputText: ${GEOPOP_SENHA}
# Dispensa o teclado tocando num texto estatico (hideKeyboard falha em inputs seguros no iOS)
- tapOn: "Acesse sua conta"
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
